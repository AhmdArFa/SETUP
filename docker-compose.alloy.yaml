# Alloy preview: LobeHub-based MCIT AI (agent UI), not Open Notebook.
# Alloy proxies :8080 → frontendPort 8502. A tiny host proxy on 8502 forwards to
# the Lobe app on 3210 so the cloud preview works without localhost access.

services:
  ollama:
    image: ollama/ollama:latest
    network_mode: host
    environment:
      - OLLAMA_HOST=127.0.0.1:11434
    volumes:
      - ./ollama_data:/root/.ollama
    restart: always

  # Keep local LLM available; Lobe stack itself runs via
  # lobe-mcit/docker-compose/mcit (published ports). Alloy preview entry is the proxy.
  alloy-preview-proxy:
    image: node:22-bookworm
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PORT=8502
      - TPORT=3210
      - TARGET=127.0.0.1
    command:
      - bash
      - -lc
      - |
        cat > /tmp/proxy.js <<'JS'
        const http = require('http');
        const TARGET = process.env.TARGET || '127.0.0.1';
        const TPORT = Number(process.env.TPORT || 3210);
        const PORT = Number(process.env.PORT || 8502);
        const server = http.createServer((req, res) => {
          const headers = { ...req.headers, host: TARGET + ':' + TPORT };
          const p = http.request({ hostname: TARGET, port: TPORT, path: req.url, method: req.method, headers }, (pr) => {
            res.writeHead(pr.statusCode || 502, pr.headers);
            pr.pipe(res);
          });
          p.on('error', (e) => { res.writeHead(502); res.end(String(e)); });
          req.pipe(p);
        });
        server.on('upgrade', (req, socket) => {
          const p = http.request({ hostname: TARGET, port: TPORT, path: req.url, method: req.method, headers: { ...req.headers, host: TARGET + ':' + TPORT } });
          p.on('upgrade', (pr, ps, ph) => {
            socket.write('HTTP/1.1 101 Switching Protocols\r\n' + Object.entries(pr.headers).map(([k,v]) => k + ': ' + v).join('\r\n') + '\r\n\r\n');
            if (ph?.length) socket.write(ph);
            ps.pipe(socket); socket.pipe(ps);
          });
          p.on('error', () => socket.destroy());
          p.end();
        });
        server.listen(PORT, '0.0.0.0', () => console.log('MCIT Alloy proxy :' + PORT + ' -> ' + TARGET + ':' + TPORT));
        JS
        node /tmp/proxy.js
    restart: always
